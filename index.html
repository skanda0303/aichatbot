<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas · Research desk</title>
  <meta name="description" content="Ask questions about your documents and compare sources in Atlas." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:wght@500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="/production_tables.css" />
  <style>
    :root {
      color-scheme: light;
      --paper: #fdfaf4;
      --shelf: #f3eee4;
      --surface: #fffdf8;
      --field: #f8f3ea;
      --hover: #ebe2d5;
      --line: #ddd2c3;
      --field-line: #95887a;
      --ink: #2b241f;
      --muted: #65584e;
      --accent: #864630;
      --accent-hover: #693622;
      --accent-wash: #f3e3da;
      --button: #864630;
      --button-hover: #693622;
      --on-button: #fffaf4;
      --danger: #a13730;
      --shadow: 0 12px 36px rgb(60 39 25 / 12%);
      --sans: 'Atkinson Hyperlegible', system-ui, sans-serif;
      --serif: 'Crimson Pro', Georgia, serif;
      --mono: ui-monospace, Consolas, monospace;
    }

    body.dark {
      color-scheme: dark;
      --paper: #211d1a;
      --shelf: #29231f;
      --surface: #302923;
      --field: #332c26;
      --hover: #3e342c;
      --line: #493e35;
      --field-line: #8c7b6d;
      --ink: #f2e8dc;
      --muted: #c4b3a3;
      --accent: #edae93;
      --accent-hover: #fad0bf;
      --accent-wash: #443027;
      --button: #a05238;
      --button-hover: #8d4833;
      --on-button: #fffaf4;
      --danger: #ffada5;
      --shadow: 0 12px 36px rgb(0 0 0 / 28%);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, p { margin: 0; }
    h1, h2, h3 { text-wrap: balance; }
    p { text-wrap: pretty; }
    button, input { font: inherit; color: inherit; }
    button { border: 0; background: transparent; cursor: pointer; }
    button:disabled { cursor: default; opacity: .55; }
    button, summary, a, input { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    ::selection { color: var(--ink); background: var(--accent-wash); }
    input { caret-color: var(--accent); }
    input::placeholder { color: var(--muted); opacity: 1; }
    svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; flex: none; }

    .app-shell {
      display: grid;
      grid-template-columns: 236px minmax(0, 1fr) 294px;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    .sidebar, .right-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding: 22px 18px;
      background: var(--shelf);
    }
    .sidebar { border-right: 1px solid var(--line); }
    .right-panel { border-left: 1px solid var(--line); }
    .brand, .panel-title, .history-heading, .topbar,
    .workspace-heading, .viewer-actions { display: flex; align-items: center; gap: 10px; }
    .brand, .panel-title, .history-heading, .topbar { justify-content: space-between; }
    .brand { margin-bottom: 24px; }
    .brand strong {
      font: 600 2.1rem/1 var(--serif);
      letter-spacing: -.035em;
    }

    .icon-btn, .mobile-toggle {
      display: inline-grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 8px;
      color: var(--muted);
    }
    .mobile-toggle, .drawer-close { display: none; }
    .icon-btn, .new-chat, .suggestion, .send-btn, .upload-btn,
    .doc-card, .chat-item, .viewer-actions button, .clear-chat-btn {
      transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
    }
    .icon-btn:hover, .icon-btn[aria-pressed="true"], .mobile-toggle:hover, .viewer-actions button:hover {
      background: var(--hover);
      color: var(--ink);
    }

    .new-chat, .upload-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid var(--field-line);
      border-radius: 8px;
      background: var(--surface);
      font-size: .875rem;
      font-weight: 700;
    }
    .new-chat { justify-content: flex-start; margin-bottom: 22px; }
    .new-chat:hover, .upload-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-wash); }
    .new-chat svg, .upload-btn svg { width: 16px; height: 16px; }
    .history-heading h2, .panel-title h2 { font-size: .9375rem; font-weight: 700; }
    .clear-chat-btn { min-height: 44px; padding: 0 5px; color: var(--muted); font-size: .8125rem; }
    .clear-chat-btn:hover, .viewer-actions .danger-btn:hover { color: var(--danger); }
    .chat-list, .doc-list { min-height: 0; flex: 1; overflow: auto; }
    .chat-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      width: 100%;
      min-height: 44px;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      text-align: left;
    }
    .chat-item:hover, .chat-item.active { background: var(--hover); }
    .chat-item.active { border-color: var(--line); }
    .chat-item svg { margin-top: 2px; color: var(--muted); }
    .chat-item span, .doc-name { min-width: 0; }
    .chat-item strong, .doc-name strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .875rem; }
    .chat-item small, .doc-name small { display: block; color: var(--muted); font-size: .8125rem; }
    .chat-item:focus-visible, .doc-card:focus-visible { outline-offset: -2px; }
    .chat-list, .doc-list, .messages { scrollbar-color: var(--field-line) transparent; scrollbar-width: thin; }

    .settings { border-top: 1px solid var(--line); margin-top: 16px; }
    .settings summary { padding: 13px 2px; color: var(--muted); cursor: pointer; font-size: .875rem; }
    .settings label { display: block; margin: 8px 0 4px; font-size: .8125rem; }
    .settings p { margin: 8px 0 0; color: var(--muted); font-size: .8125rem; }
    .settings-input, .doc-search-input {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      border: 1px solid var(--field-line);
      border-radius: 8px;
      background: var(--field);
      font-size: .875rem;
    }

    .center { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .topbar {
      min-height: 76px;
      padding: 12px clamp(16px, 3vw, 42px);
      border-bottom: 1px solid var(--line);
    }
    .topbar h1 { font: 600 1.65rem/1 var(--serif); }
    .status { margin-left: auto; text-align: right; color: var(--muted); font-size: .875rem; }
    .status:empty { margin: 0; }
    .messages {
      flex: 1;
      overflow: auto;
      padding: 32px max(24px, calc((100% - 690px) / 2));
    }
    .welcome { margin: clamp(36px, 10vh, 105px) 0 28px; }
    .welcome h2 {
      max-width: 15ch;
      font: 500 4.25rem/.98 var(--serif);
      letter-spacing: -.035em;
    }
    .welcome p { max-width: 42ch; margin-top: 18px; color: var(--muted); font-size: 1.0625rem; }
    .suggestions { display: grid; max-width: 420px; margin-top: 28px; border-top: 1px solid var(--line); }
    .suggestion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
      padding: 9px 6px 9px 0;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }
    .suggestion svg { color: var(--accent); width: 16px; height: 16px; }
    .suggestion:hover { color: var(--accent); background: var(--field); }

    .msg { margin: 0 0 24px; overflow-wrap: anywhere; }
    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .bubble {
      max-width: 86%;
      padding: 11px 15px;
      border-radius: 12px 12px 3px 12px;
      background: var(--accent-wash);
      white-space: pre-wrap;
    }
    .msg.bot .bubble { line-height: 1.65; }
    .msg.bot .bubble p + *, .msg.bot .bubble blockquote, .msg.bot .bubble pre { margin-top: 14px; }
    .msg.bot .bubble :is(h1, h2, h3) { margin: 18px 0 8px; line-height: 1.25; }
    .msg.bot .bubble ul, .msg.bot .bubble ol { padding-left: 24px; }
    .msg.bot .bubble blockquote { margin-inline: 0; padding: 8px 14px; border-inline-start: 1px solid var(--field-line); color: var(--muted); }
    .msg.bot .bubble pre { overflow: auto; padding: 14px; border-radius: 8px; background: var(--field); }
    .msg.bot .bubble code, .text-preview { font: .84375rem/1.65 var(--mono); }
    .msg.bot .bubble :not(pre) > code { padding: 2px 4px; border-radius: 4px; background: var(--field); }
    .msg.bot .bubble a { color: var(--accent); text-underline-offset: .18em; }
    .msg.bot .bubble img { max-width: 100%; }
    .msg-meta { margin-top: 10px; color: var(--muted); font-size: .8125rem; font-variant-numeric: tabular-nums; }

    .input-wrap { padding: 12px 24px max(22px, env(safe-area-inset-bottom)); }
    .composer {
      display: flex;
      gap: 10px;
      max-width: 690px;
      margin: auto;
      padding: 7px 7px 7px 14px;
      border: 1px solid var(--field-line);
      border-radius: 12px;
      background: var(--surface);
    }
    .composer:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    .composer input { flex: 1; min-width: 0; border: 0; background: transparent; outline: 0; }
    .send-btn {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex: none;
      border-radius: 8px;
      background: var(--button);
      color: var(--on-button);
    }
    .send-btn:hover:not(:disabled) { background: var(--button-hover); }
    .send-btn:active:not(:disabled) { scale: .96; }

    .panel-title { margin-bottom: 14px; }
    .panel-title h2 { display: flex; align-items: baseline; gap: 7px; }
    .count { color: var(--muted); font-size: .8125rem; font-weight: 400; font-variant-numeric: tabular-nums; }
    .doc-search-input { margin-bottom: 12px; }
    .doc-card {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 56px;
      padding: 8px 4px;
      border-radius: 8px;
      text-align: left;
    }
    .doc-card:hover, .doc-card.selected { background: var(--hover); }
    .doc-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 34px;
      flex: none;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      color: var(--muted);
      font-size: .6875rem;
      font-weight: 700;
    }
    .empty { padding: 12px 4px; color: var(--muted); font-size: .875rem; }

    .viewer {
      width: min(94vw, 1120px);
      height: 88vh;
      height: 88dvh;
      max-width: none;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: var(--shadow);
    }
    .viewer[open] { display: flex; flex-direction: column; gap: 12px; }
    .viewer::backdrop, .drawer-backdrop { background: rgb(32 24 20 / 48%); }
    .viewer h3 { font: 600 1.6rem/1.1 var(--serif); overflow-wrap: anywhere; }
    .viewer-actions { flex-wrap: wrap; gap: 4px; }
    .viewer-actions button { min-height: 44px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font-size: .875rem; }
    .viewer-actions .icon-btn { margin-left: auto; }
    .viewer iframe, .text-preview, .pdf-viewer-wrap {
      width: 100%;
      min-height: 0;
      flex: 1;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }
    .pdf-viewer-wrap, .text-preview { overflow: auto; padding: 14px; }
    .pdf-page-canvas { display: block; max-width: 100%; height: auto; margin: 0 auto 14px; background: white; }
    .text-preview { white-space: pre-wrap; overflow-wrap: anywhere; }

    @media (max-width: 1140px) {
      .app-shell { grid-template-columns: 204px minmax(0, 1fr) 244px; }
      .sidebar, .right-panel { padding-inline: 14px; }
      .welcome h2 { font-size: 3.75rem; }
    }
    @media (max-width: 920px) {
      .app-shell { grid-template-columns: minmax(0, 1fr); }
      .sidebar, .right-panel { display: none; }
      .sidebar.open, .right-panel.open {
        display: flex;
        position: fixed;
        z-index: 2;
        inset-block: 0;
        width: min(320px, 90vw);
        box-shadow: var(--shadow);
      }
      .sidebar.open { left: 0; }
      .right-panel.open { right: 0; }
      .drawer-backdrop { position: fixed; z-index: 1; inset: 0; }
      .mobile-toggle, .drawer-close { display: inline-grid; }
    }
    @media (max-width: 540px) {
      .topbar { min-height: 62px; padding: 8px 12px; gap: 6px; }
      .workspace-heading { gap: 4px; }
      .topbar h1 { font-size: 1.4rem; }
      .messages { padding: 22px 20px; }
      .welcome { margin-top: 28px; }
      .welcome h2 { font-size: 3.1rem; }
      .welcome p { font-size: 1rem; }
      .input-wrap { padding-inline: 16px; }
      .viewer { padding: 14px; }
    }
    @media (max-height: 600px) { .welcome { margin-top: 12px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="brand">
        <strong>Atlas</strong>
        <button class="icon-btn" id="theme-toggle" type="button" aria-pressed="false" aria-label="Dark mode" title="Dark mode">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.9 13.3a9 9 0 0 1-10.2-10.2 9 9 0 1 0 10.2 10.2Z"/></svg>
        </button>
        <button class="icon-btn drawer-close" type="button" aria-label="Close conversations"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <button class="new-chat" id="new-chat" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> New conversation</button>
      <div class="history-heading">
        <h2>Conversations</h2>
        <button class="clear-chat-btn" id="clear-chat" type="button" aria-label="Clear chat history">Clear</button>
      </div>
      <div class="chat-list" id="chat-list"></div>
      <details class="settings">
        <summary>API keys</summary>
        <label for="user-gemini-key">Gemini API key</label>
        <input type="password" id="user-gemini-key" class="settings-input" autocomplete="off" />
        <label for="user-tavily-key">Tavily API key</label>
        <input type="password" id="user-tavily-key" class="settings-input" autocomplete="off" />
        <p>Optional. Keys are saved in this browser and sent with your requests.</p>
      </details>
    </aside>

    <main class="center" id="research-desk">
      <header class="topbar">
        <div class="workspace-heading">
          <button class="mobile-toggle" id="open-chats" type="button" aria-label="Open conversations" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v10H9l-4 3V6Z"/></svg></button>
          <h1>Research desk</h1>
        </div>
        <span class="status" id="status-text" role="status"></span>
        <button class="mobile-toggle" id="open-docs" type="button" aria-label="Open documents" aria-controls="right-panel" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 12h7m-7 4h7"/></svg></button>
      </header>
      <div class="messages" id="messages" aria-label="Conversation"></div>
      <div class="input-wrap">
        <form class="composer" id="composer">
          <input id="input" type="text" aria-label="Your question" placeholder="Ask about your documents…" autocomplete="off" />
          <button class="send-btn" id="btn" type="submit" aria-label="Send question" title="Send question"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        </form>
      </div>
    </main>

    <aside class="right-panel" id="right-panel" aria-label="Documents">
      <div class="panel-title">
        <h2>Documents <span class="count" id="doc-count" hidden></span></h2>
        <button id="upload-doc-btn" class="upload-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m-4 4 4-4 4 4M5 16v4h14v-4"/></svg><span id="upload-label">Upload</span></button>
        <input type="file" id="upload-doc-file" accept=".pdf,.csv,.txt,.md,.json" hidden />
        <button class="icon-btn drawer-close" type="button" aria-label="Close documents"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <input type="search" id="doc-search" aria-label="Filter documents" placeholder="Filter by name" class="doc-search-input" />
      <div class="doc-list" id="doc-list" aria-live="polite">
        <p class="empty">Loading documents…</p>
      </div>
    </aside>
    <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  </div>

  <template id="welcome-template">
    <section class="welcome" id="welcome">
      <h2>What are you looking for?</h2>
      <p>Ask about a file, compare sources, or follow a question beyond your documents.</p>
      <div class="suggestions">
        <button class="suggestion" type="button"><span>Summarize my documents</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        <button class="suggestion" type="button"><span>Find common themes across sources</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
        <button class="suggestion" type="button"><span>Where do these sources disagree?</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
      </div>
    </section>
  </template>

  <dialog class="viewer" id="viewer" aria-labelledby="viewer-title">
    <h3 id="viewer-title"></h3>
    <div class="viewer-actions">
      <button id="viewer-toggle-mode" type="button">Read text</button>
      <button id="viewer-open-tab" type="button">Open in tab</button>
      <button id="viewer-download" type="button">Download</button>
      <button id="viewer-delete" type="button" class="danger-btn">Delete</button>
      <button id="viewer-close" type="button" class="icon-btn" aria-label="Close preview" autofocus><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
    </div>
  </dialog>

  <script>
    let SESSION_ID = "user-" + Math.random().toString(36).slice(2, 9);
    let activeDocument = null;
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const btn = document.getElementById("btn");
    const markdown = window.marked;
    markdown?.setOptions({ breaks: true, gfm: true });

    function renderAnswer(bubble, text) {
      if (markdown) bubble.innerHTML = markdown.parse(text);
      else bubble.textContent = text;
    }

    const themeBtn = document.getElementById("theme-toggle");
    function setTheme(dark) {
      document.body.classList.toggle("dark", dark);
      themeBtn.setAttribute("aria-pressed", String(dark));
    }
    themeBtn.onclick = () => {
      const dark = !document.body.classList.contains("dark");
      localStorage.setItem("darkTheme", String(dark));
      setTheme(dark);
    };
    setTheme(localStorage.getItem("darkTheme") === "true");

    // API Keys Logic
    const geminiInput = document.getElementById("user-gemini-key");
    const tavilyInput = document.getElementById("user-tavily-key");
    geminiInput.value = localStorage.getItem("userGeminiKey") || "";
    tavilyInput.value = localStorage.getItem("userTavilyKey") || "";
    geminiInput.onchange = (e) => localStorage.setItem("userGeminiKey", e.target.value.trim());
    tavilyInput.onchange = (e) => localStorage.setItem("userTavilyKey", e.target.value.trim());

    function formatSize(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1048576) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1048576).toFixed(1)} MB`;
    }

    function addMessage(role, content) {
      const row = document.createElement("div");
      row.className = `msg ${role}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "bot") renderAnswer(bubble, content);
      else bubble.textContent = content;
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    function showWelcome() {
      messages.replaceChildren(document.getElementById("welcome-template").content.cloneNode(true));
    }

    function clearWelcome() {
      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();
    }

    function setStatus(text) {
      document.getElementById("status-text").textContent = text;
    }

    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }

    const docList = document.getElementById("doc-list");
    const docSearch = document.getElementById("doc-search");

    function filterDocuments() {
      const query = docSearch.value.trim().toLowerCase();
      const cards = [...docList.querySelectorAll(".doc-card")];
      cards.forEach(card => {
        card.hidden = !card.querySelector("strong").textContent.toLowerCase().includes(query);
      });
      const noResults = document.getElementById("doc-search-empty");
      if (noResults) noResults.hidden = cards.some(card => !card.hidden);
    }

    async function loadDocuments() {
      const count = document.getElementById("doc-count");
      try {
        const res = await fetch("/api/documents");
        if (!res.ok) throw new Error();
        const { documents } = await res.json();
        count.textContent = documents.length;
        count.hidden = false;
        docList.replaceChildren();
        if (!documents.length) {
          docList.innerHTML = '<p class="empty">No documents yet. Upload a file to get started.</p>';
          return;
        }
        documents.forEach(doc => {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "doc-card";
          card.classList.toggle("selected", doc.name === activeDocument?.name);
          card.innerHTML = '<span class="doc-icon" aria-hidden="true"></span><span class="doc-name"><strong></strong><small></small></span>';
          card.querySelector(".doc-icon").textContent = doc.type.slice(0, 3);
          const name = card.querySelector("strong");
          name.textContent = doc.name;
          name.title = doc.name;
          card.querySelector("small").textContent = `${doc.type} · ${formatSize(doc.size)}`;
          card.onclick = () => selectDocument(doc, card);
          docList.appendChild(card);
        });
        docList.insertAdjacentHTML("beforeend", '<p class="empty" id="doc-search-empty" hidden>No documents match that name.</p>');
        filterDocuments();
      } catch {
        count.hidden = true;
        docList.innerHTML = '<p class="empty">Unable to load documents. Refresh the page to try again.</p>';
      }
    }
    docSearch.oninput = filterDocuments;

    const viewer = document.getElementById("viewer");
    let currentViewMode = "visual";
    let previewRequest = 0;

    async function selectDocument(doc, card, mode = null) {
      if (card) {
        docList.querySelector(".selected")?.classList.remove("selected");
        card.classList.add("selected");
      }
      activeDocument = doc;
      currentViewMode = mode ?? "visual";
      const request = ++previewRequest;
      const toggleBtn = document.getElementById("viewer-toggle-mode");
      toggleBtn.hidden = doc.type !== "PDF";
      toggleBtn.textContent = currentViewMode === "visual" ? "Read text" : "View pages";
      document.getElementById("viewer-title").textContent = doc.name;
      viewer.querySelector("iframe, .pdf-viewer-wrap, .text-preview, .viewer-error")?.remove();
      if (!viewer.open) viewer.showModal();

      if (doc.type === "PDF") {
        if (currentViewMode === "text") {
          const preview = document.createElement("div");
          preview.className = "text-preview";
          preview.textContent = "Extracting text content from PDF…";
          viewer.appendChild(preview);

          try {
            if (!window.pdfjsLib) throw new Error("PDF.js library not loaded");
            const pdf = await pdfjsLib.getDocument(doc.url).promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
              const page = await pdf.getPage(i);
              const content = await page.getTextContent();
              const pageText = content.items.map(item => item.str).join(" ");
              fullText += `=== Page ${i} ===\n\n${pageText.trim()}\n\n`;
            }
            preview.textContent = fullText.trim() || "No text layer found in this PDF. Use “View pages” or “Open in tab” to read the file.";
          } catch (e) {
            preview.textContent = "Could not extract text. Use “Open in tab” or “Download” to read this PDF.";
          }
          return;
        }

        const wrap = document.createElement("div");
        wrap.className = "pdf-viewer-wrap";
        wrap.innerHTML = '<div class="empty">Rendering PDF pages…</div>';
        viewer.appendChild(wrap);

        let rendered = false;
        if (window.pdfjsLib) {
          try {
            const pdf = await pdfjsLib.getDocument(doc.url).promise;
            wrap.innerHTML = "";
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
              const page = await pdf.getPage(pageNum);
              const viewport = page.getViewport({ scale: 1.25 });
              const canvas = document.createElement("canvas");
              canvas.className = "pdf-page-canvas";
              const context = canvas.getContext("2d");
              canvas.height = viewport.height;
              canvas.width = viewport.width;
              wrap.appendChild(canvas);
              await page.render({ canvasContext: context, viewport: viewport }).promise;
            }
            rendered = true;
          } catch (err) {
            console.warn("PDF.js render error:", err);
          }
        }

        if (!rendered && request === previewRequest) {
          wrap.remove();
          const fullUrl = new URL(doc.url, window.location.href).href;
          const frame = document.createElement("iframe");
          frame.title = doc.name;
          if (window.location.protocol.startsWith("http") && !window.location.hostname.includes("localhost") && !window.location.hostname.includes("127.0.0.1")) {
            frame.src = `https://docs.google.com/gview?url=${encodeURIComponent(fullUrl)}&embedded=true`;
          } else {
            frame.src = doc.url;
          }
          viewer.appendChild(frame);
        }
      } else {
        try {
          const response = await fetch(doc.url);
          if (!response.ok) throw new Error();
          const text = await response.text();
          if (request !== previewRequest) return;
          const preview = document.createElement("div");
          preview.className = "text-preview";
          preview.textContent = text;
          viewer.appendChild(preview);
        } catch {
          if (request === previewRequest) showViewerError();
        }
      }
    }

    function showViewerError() {
      const error = document.createElement("div");
      error.className = "empty viewer-error";
      error.textContent = "Couldn’t open a preview. Use “Open in tab” or “Download” to read the file.";
      viewer.appendChild(error);
    }
    function closeViewer() {
      viewer.close();
    }

    viewer.addEventListener("close", () => {
      previewRequest++;
      viewer.querySelector("iframe, .pdf-viewer-wrap, .text-preview, .viewer-error")?.remove();
    });

    function downloadDocument() {
      if (!activeDocument) return;
      const link = document.createElement("a");
      link.href = activeDocument.download_url;
      link.download = activeDocument.name;
      link.click();
    }
    function openDocumentTab() {
      if (!activeDocument) return;
      window.open(activeDocument.url, "_blank", "noopener");
    }
    async function deleteDocumentByName(name) {
      if (!confirm(`Are you sure you want to delete '${name}' from workspace? This will re-index your knowledge base.`)) return;
      setStatus("Removing document…");
      try {
        const res = await fetch(`/api/documents/${encodeURIComponent(name)}`, { method: "DELETE" });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Delete failed");
        if (activeDocument?.name === name) {
          activeDocument = null;
          closeViewer();
        }
        await loadDocuments();
      } catch (err) {
        alert("Delete error: " + err.message);
      } finally {
        setStatus("");
      }
    }

    function renderChatList() {
      const list = document.getElementById("chat-list");
      const chats = JSON.parse(localStorage.getItem("atlasChats") || "[]");
      list.innerHTML = chats.length ? "" : '<div class="empty">Your conversations will show up here.</div>';
      chats.slice().reverse().forEach(chat => {
        const item = document.createElement("button");
        item.className = `chat-item ${chat.id === SESSION_ID ? "active" : ""}`;
        item.type = "button";
        item.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14v10H9l-4 3V6Z"/></svg><span><strong></strong><small></small></span>';
        item.querySelector("strong").textContent = chat.title;
        item.querySelector("small").textContent = chat.date;
        item.onclick = () => {
          SESSION_ID = chat.id;
          messages.innerHTML = "";
          addMessage("bot", "Conversation opened. What would you like to ask next?");
          renderChatList();
          closeDrawer(false);
          input.focus();
        };
        list.appendChild(item);
      });
    }

    function rememberChat(title) {
      const chats = JSON.parse(localStorage.getItem("atlasChats") || "[]");
      const existing = chats.find(chat => chat.id === SESSION_ID);
      if (existing) {
        existing.title = existing.title === "New Conversation" ? title : existing.title;
      } else chats.push({ id: SESSION_ID, title, date: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" }) });
      localStorage.setItem("atlasChats", JSON.stringify(chats));
      renderChatList();
    }

    function newChat() {
      SESSION_ID = "user-" + Math.random().toString(36).slice(2, 9);
      showWelcome();
      renderChatList();
      closeDrawer(false);
      input.focus();
    }

    async function send() {
      const text = input.value.trim();
      if (!text || btn.disabled) return;
      clearWelcome();
      addMessage("user", text);
      rememberChat(text);
      input.value = "";
      btn.disabled = true;
      setStatus("Finding an answer…");
      const bubble = addMessage("bot", "Reading your question…");
      const started = performance.now();
      let buffer = "";
      let rawBuf = "";
      try { 
        const geminiKey = localStorage.getItem("userGeminiKey") || "";
        const tavilyKey = localStorage.getItem("userTavilyKey") || "";
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Gemini-Key": geminiKey, "X-Tavily-Key": tavilyKey },
          body: JSON.stringify({ session_id: SESSION_ID, message: text, selected_doc: activeDocument ? activeDocument.name : null })
        });
        if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          rawBuf += decoder.decode(value, { stream: true });
          let index;
          while ((index = rawBuf.indexOf("\n")) !== -1) {
            const line = rawBuf.slice(0, index).trim();
            rawBuf = rawBuf.slice(index + 1);
            if (!line) continue;
            let event;
            try { event = JSON.parse(line); } catch {
              buffer += line + " ";
              renderAnswer(bubble, buffer);
              continue;
            }
            if (event.type === "text") {
              buffer += event.content || "";
              renderAnswer(bubble, buffer);
              messages.scrollTop = messages.scrollHeight;
            } else if (event.type === "error" && event.stage === "supervisor") {
              buffer += `\n\n_Error: ${event.message || "Agent failed"}_`;
              renderAnswer(bubble, buffer);
            }
          }
        }
        if (!buffer.trim()) bubble.textContent = "No answer came back. Try asking again.";
        const seconds = ((performance.now() - started) / 1000).toFixed(1);
        const meta = document.createElement("div");
        meta.className = "msg-meta";
        meta.textContent = `Answered in ${seconds}s`;
        messages.appendChild(meta);
      } catch {
        bubble.textContent = "Couldn’t get an answer. Try again in a moment.";
      } finally {
        btn.disabled = false;
        setStatus("");
        messages.scrollTop = messages.scrollHeight;
      }
    }

    const uploadBtn = document.getElementById("upload-doc-btn");
    const uploadInput = document.getElementById("upload-doc-file");
    const uploadLabel = document.getElementById("upload-label");
    if (uploadBtn && uploadInput) {
      uploadBtn.onclick = () => uploadInput.click();
      uploadInput.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        uploadBtn.disabled = true;
        uploadLabel.textContent = "Uploading…";
        setStatus("Adding document…");
        const formData = new FormData();
        formData.append("file", file);
        try {
          const res = await fetch("/api/upload", { method: "POST", body: formData });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Upload failed");
          await loadDocuments();
        } catch (err) {
          alert("Upload error: " + err.message);
        } finally {
          uploadBtn.disabled = false;
          uploadLabel.textContent = "Upload";
          uploadInput.value = "";
          setStatus("");
        }
      };
    }

    async function clearHistory() {
      await fetch("/clear", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: SESSION_ID, message: "" }) }).catch(() => {});
      localStorage.removeItem("atlasChats");
      newChat();
    }

    const drawers = {
      sidebar: document.getElementById("open-chats"),
      "right-panel": document.getElementById("open-docs"),
    };
    const drawerBackdrop = document.getElementById("drawer-backdrop");
    const researchDesk = document.getElementById("research-desk");
    const drawerViewport = window.matchMedia("(max-width: 920px)");
    let openDrawer = null;

    function closeDrawer(restoreFocus = true) {
      if (!openDrawer) return;
      openDrawer.classList.remove("open");
      const trigger = drawers[openDrawer.id];
      trigger.setAttribute("aria-expanded", "false");
      drawerBackdrop.hidden = true;
      researchDesk.inert = false;
      openDrawer = null;
      if (restoreFocus) trigger.focus();
    }

    Object.entries(drawers).forEach(([id, trigger]) => {
      const panel = document.getElementById(id);
      const close = panel.querySelector(".drawer-close");
      close.onclick = () => closeDrawer();
      trigger.onclick = () => {
        openDrawer = panel;
        panel.classList.add("open");
        trigger.setAttribute("aria-expanded", "true");
        drawerBackdrop.hidden = false;
        researchDesk.inert = true;
        close.focus();
      };
    });
    drawerBackdrop.onclick = () => closeDrawer();
    drawerViewport.addEventListener("change", () => closeDrawer(false));
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !viewer.open && !event.defaultPrevented) closeDrawer();
    });

    document.getElementById("composer").onsubmit = event => {
      event.preventDefault();
      send();
    };
    document.getElementById("new-chat").onclick = newChat;
    document.getElementById("viewer-close").onclick = closeViewer;
    document.getElementById("viewer-download").onclick = downloadDocument;
    document.getElementById("viewer-open-tab").onclick = openDocumentTab;
    document.getElementById("viewer-delete").onclick = () => {
      if (activeDocument) deleteDocumentByName(activeDocument.name);
    };
    document.getElementById("viewer-toggle-mode").onclick = () => {
      if (activeDocument) selectDocument(activeDocument, null, currentViewMode === "visual" ? "text" : "visual");
    };
    messages.addEventListener("click", event => {
      const suggestion = event.target.closest(".suggestion");
      if (!suggestion) return;
      input.value = suggestion.querySelector("span").textContent;
      input.focus();
    });

    document.getElementById("clear-chat").onclick = async () => {
      if (confirm("Clear all conversations and reset chat session?")) {
        await clearHistory();
      }
    };

    showWelcome();
    renderChatList();
    loadDocuments();
  </script>
</body>
</html>
